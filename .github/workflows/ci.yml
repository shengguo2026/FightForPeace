name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Install Playwright browsers
        run: pnpm --filter @ffp/game exec playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests (Chromium, Firefox, WebKit)
        run: pnpm e2e
      - run: pnpm build
      - name: Portable zip
        run: node tools/release.mjs
      - name: Portable smoke test (unzip and start)
        run: pnpm smoke:portable
      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: FightForPeace-portable
          path: release/FightForPeace-*.zip
          if-no-files-found: error
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/game/test-results/**/*.png
          if-no-files-found: warn
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/game/playwright-report
          if-no-files-found: ignore

  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release
      - name: Portable smoke test with start.bat
        run: pnpm smoke:portable

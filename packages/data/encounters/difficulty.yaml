# Difficulty profiles (spec Appendix D.2 and D.5, Combat Lab Candidate 0.2). Medium is the
# reference. Pairs are [solo, co-op]. Difficulty changes budgets, concurrency, perception
# and decision quality, never hero controls or defensive timing windows. `guardScale`
# multiplies how often enemies take their guard chances (percent of the profile rate).
# M14 follow-up: `pace` is the percent of each enemy attack's authored cooldown (higher
# difficulties come back sooner, so the larger budgets are actually used) and `recovery`
# the percent of a food pickup's Health restored (D.2 resource direction). With `riposte`
# an enemy that blocked a hit answers it at once instead of holding its guard.
difficulties:
  - id: easy
    name: Easy
    budget: [48, 76]
    cap: 46
    perception: 24
    attackers: [2, 3]
    projectiles: [1, 2]
    hardCC: 1
    groupCooldown: 360
    warning: 72
    guardScale: 60
    pace: 100
    recovery: 100
    riposte: false
  - id: medium
    name: Medium

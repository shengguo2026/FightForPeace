# M28 · Stage 3 *Shadows over the Herb Mountain*: the journey's encounters (Stage 3 spec
# §5, §7, §10, §11, §13, §22.4). Each arena is one arena beat of stages/stage3.yaml: its
# waves are the beat's encounter, with its weapons, food, breakables, carts, winch, and the
# M25 objectives (captives on the `rescue` ladder, the research record case on the `record`
# outcome, and the visible hostile actions against them). Loaded after every Lab file
# (arena indices only ever append, lesson G1). Pixels and frames at 60 Hz; every number is
# a Combat Lab candidate.
#
# Population (§11.3): Medium about 30 ordinary enemies over the twelve encounters, Easy
# about 22, Hard and above more objective pressure; Ridge Stalkers from Extreme, Pack
# Captains at Ultimate; co-op adds about a third (`coop: true`).
# Weapons (§10.1): two Hiking Staffs, one Wood Axe, two Quarry Hammers, one revolver with
# five rounds; Easy adds a staff and a hammer, Extreme and Ultimate drop the second staff.
# Food (§10.2): three rice parcels, two broths, two seed cakes; the camp meal only in the
# Herbalist Shelter. Easy adds three common items; Hard and above drop some.
#
# Captives sit behind the bandits; freed, they walk back along the trail to shelter at the
# left edge, waiting at a hand-off point while a bandit is in their zone. Hostile actions
# (a rope pulled taut, a lantern kicked over, a crate dragged against the enclosure) are
# visible, interruptible and count once each: none Secure, one Strained, two or more
# Critical. Nothing depends on time (spec §7.2).
arenas:

# Trail Ambusher (Stage 3 spec §11.1): mobile approach and flank pressure with visible paths
# and bounded pursuit. It sprints in along a readable line, swings from the open side and
# dodges back; it never guards. Sheets: IDLE-RUN, ATTACK (0 swing wind-up, 1 follow-through,
# 2 low lunge, 3 flank dash, 4 jumping strike, 5 dodge back), HIT, RUN, FLEE.
# M27 Combat Lab candidates.
id: ambusher
name: Trail Ambusher
bodyWidth: 66
actions:
  - id: club-swing
    name: Trail Club Swing
    category: standing
    input: { context: script, dir: neutral }
    frames: { startup: 13, active: 4, recovery: 18, blockstun: 12 }
    hitbox: { x: 20, w: 115, y: 120, h: 140, depth: 34 }
    damage: 40
    reaction: { kind: stagger, hitstun: 18, push: 4 }
    costs: { stun: 10, scale: 10, starter: 10, guard: 10 }
    meter: 0
    tags: [counterable]

  - id: low-lunge
    name: Low Lunge
    category: low
    input: { context: script, dir: neutral }
    frames: { startup: 14, active: 4, recovery: 22, blockstun: 12 }
    hitbox: { x: 15, w: 130, y: 0, h: 80, depth: 32 }
    damage: 34
    reaction: { kind: stagger, hitstun: 16, push: 3 }
    costs: { stun: 10, scale: 10, starter: 10, guard: 8 }
    meter: 0
    tags: [counterable]
    moves:
      - { from: 4, to: 16, forward: 4 }

  - id: flank-dash
    name: Flank Dash
    category: standing
    input: { context: script, dir: neutral }
    frames: { startup: 18, active: [3, 8, 3], recovery: 24, blockstun: 14 }
    hitbox: { x: 20, w: 120, y: 100, h: 140, depth: 34 }
    damage: 46
    reaction: { kind: knockback, hitstun: 20, push: 8 }
    costs: { stun: 12, scale: 12, guard: 10 }
    meter: 0
    tags: [counterable]
    note: 'A long, readable sprint line (the run pose) before the swing; stops at the target.'
    moves:
      - { from: 6, to: 30, forward: 7 }

  - id: ledge-drop
    name: Ledge Drop
    category: standing
    input: { context: script, dir: neutral }
    frames: { startup: 20, active: 4, recovery: 26, blockstun: 14 }
    hitbox: { x: 10, w: 110, y: 40, h: 220, depth: 34 }
    damage: 52
    reaction: { kind: knockdown, hitstun: 26, push: 5, lift: 4 }
    costs: { stun: 14, scale: 12, guard: 12 }
    meter: 0
    tags: [counterable]
    moves:
      - { from: 8, to: 22, forward: 3 }

  - id: dodge-back
    name: Dodge Back
    category: standing
    input: { context: script, dir: neutral }
    frames: { startup: 2, active: 1, recovery: 22 }
    hitbox: { x: 0, w: 1, y: 0, h: 1, depth: 1 }
    damage: 0
    reaction: { kind: stagger, hitstun: 1 }
    costs: { stun: 0, scale: 0 }
    meter: 0
    tags: []
    note: 'A retreat with no invulnerability.'
    moves:
      - { from: 1, to: 14, forward: -6 }

profile:
  role: flanker
  health: 230
  walk: { x: 5, z: 3 }
  perception: 3
  ring: 360
  defense: { tier: basic, evade: { every: 4, of: 1, action: dodge-back } }
  morale: { breakAt: 22, shaken: 40 }
  weapons: never
  firearms: false
  attacks:
    - { action: club-swing, threat: 12, cooldown: 80 }
    - { action: low-lunge, threat: 14, cooldown: 140 }
    - { action: flank-dash, threat: 22, cooldown: 240, minDifficulty: medium }
    - { action: ledge-drop, threat: 24, cooldown: 300, minDifficulty: hard }

variants:
  - id: ambusher-elite
    name: Trail Ambusher Veteran
    minDifficulty: hard
    health: 260
    defense: { tier: basic, evade: { every: 3, of: 1, action: dodge-back } }
  - id: ambusher-master
    name: Trail Ambusher Pathfinder
    minDifficulty: ultimate
    health: 270
    defense: { tier: basic, evade: { every: 2, of: 1, action: dodge-back } }
    attacks:
      - { action: club-swing, threat: 12, cooldown: 70 }
      - { action: low-lunge, threat: 14, cooldown: 120 }
      - { action: flank-dash, threat: 22, cooldown: 200 }
      - { action: ledge-drop, threat: 24, cooldown: 260 }

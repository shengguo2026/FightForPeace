# Pack Captain (Stage 3 spec §11.2): the Ultimate specialist coordinating readable flank
# orders (the M19 call system). Flank Order sends two free allies to opposite depth sides of
# the target (whistle, then the cane points the flank). The call has a long raised-cane
# startup; any hit before it lands breaks it (the whistle drops). Separation (allies out
# of reach), interruption or defeat ends the benefit. One call at a time in the room.
# Sheets: IDLE-WALK (1 whistle, 4/5 point left/right), ATTACK (0 thrust, 1 swing wind-up,
# 2 follow-through, 3 rally shout, 4 step back, 5 guard), HIT, WALK, FLEE. M27 candidates.
id: captain
name: Pack Captain
bodyWidth: 70
actions:
  - id: cane-thrust
    name: Cane Thrust
    category: standing
    input: { context: script, dir: neutral }
    frames: { startup: 12, active: 3, recovery: 18, blockstun: 12 }
    hitbox: { x: 20, w: 140, y: 140, h: 80, depth: 30 }
    damage: 34
    reaction: { kind: stagger, hitstun: 18, push: 4 }
    costs: { stun: 10, scale: 10, starter: 10, guard: 8 }
    meter: 0
    tags: [counterable]


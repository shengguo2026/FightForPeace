# Sluice Commander (spec §12.3, F&D §8): the multi-phase Stage 1 boss on the Sluice plate.
# Visible Resolve absorbs extended control until depleted; depletion is a telegraphed
# Stagger Break with boss budgets. Phase thresholds queue: the crossing hit resolves,
# carryover is capped, and the next phase begins at a safe point once both heroes are
# actionable. Phase 1: palm, kicks and a flying knee. Phase 2 (coat off): faster strikes,
# the Sluice Parry counter, a Combo Breaker and the Iron Gate Handwheel. Phase 3: he works
# the sluice winch, an authored, visible, interruptible hostile action; three completed
# cranks release a flood surge across the back of the floor. Defeated, he surrenders.

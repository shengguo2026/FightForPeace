# Black-Iron Enforcer (spec §12.1, F&D §8): the sponsor-equipped Hard-and-higher challenge.
# Armoured gauntlet punches absorb strikes on the way in, a long-telegraphed unblockable
# slam, a heaving grab, exact blocks and a Combo Breaker; and a formation problem: the
# Anvil Pin group attack shoves you into a partner who strikes from the other side, under
# one shared telegraph and one 52-point reservation. M7 candidates.

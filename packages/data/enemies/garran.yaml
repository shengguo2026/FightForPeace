# Garran Voss, the Ridge Wolf (Stage 3 spec §12): Mountain Bandit Chief and former quarry
# transport foreman, Ridge Hook Wrestling with a blunt Quarry Hookstaff.
#
# Hookstaff Control: he starts holding the Quarry Hookstaff, a real item with durability,
# clash and disarm (its own actions: Long Sweep -> Guarded Thrust, Hooked Pull, Low Line,
# Short Descent). The phase ends when he no longer holds a working staff (a hero's disarm,
# the Stagger Break drop, or the staff breaks) or at the Health floor, when he casts it
# aside. The staff is never replaced; loose, any hero may take it.
#
# Clinch and Cast: Collar Tie, Shoulder Cast and Ridge Trip are grabs with the universal
# Grab Escape window and the partner interrupt (never unbreakable); Body Hooks, Two-Palm
# Shove, Shoulder Rush and a Knee Drop low line; Exact Block, Ridge Parry (counter) and a
# defense-consuming Combo Breaker.
#
# Winch Pressure (low Health): he works the terrace winch (Crank the Winch, a visible and
# interruptible action); every completed crank releases the next cargo load or cover panel
# along its warned path. A hero's strike during the warning redirects it against the
# bandits, and a redirected load that strikes him costs Resolve.
#
# Capture: a Resolve break at or below `surrender` % Health, or the final blow inside a
# Stagger window, is the clean surrender; Health 0 while Resolve remains is the forced
# capture. Both end in live custody (restraint, medical check). M27 candidates.

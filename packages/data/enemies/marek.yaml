# Marek Vane, the Gilded Jackal (Stage 2 spec §12, story line §9): a Tailored Predator boss
# with a Player-Influenced Authored Sequence. The mounted intercept (mounted.yaml,
# corridor marek-intercept) comes first and touches neither Health nor Resolve.
#
# Armed Command: he starts holding the Burst-Command Support Gun. Jackal Burst and Sweeping
# Claim spend its real rounds (three each, warned lines; the sweep covers two depth lanes
# and leaves the far one free); Stock Check up close, Cover Shift to reposition, and Command
# Pressure, one call that brings the phase's support pair once. Breaking his Resolve drops
# the gun at his feet for the heroes for the whole Stagger window. The phase ends when he no
# longer holds a loaded gun (disarmed, broken, or emptied and tossed aside) or at the Health
# floor; the gun is never replaced.
#
# Predator Unbound (the encounter's one Resolve refill): an opportunistic counter-brawler.
# Jackal's Measure (counter stance), Claimant's Advance, Road-Cutter Sweep, Spoilsman's Grip
# (a pivot grab with Grab Escape), Carrion Descent -> descending boot on a confirmed hit,
# elbow -> riding-boot strings, Exact Block and a Combo Breaker. He may take neutral melee
# weapons, never a firearm. Scorched Claim (no phase, no refill): at low Health he goes for
# the room's authored optional asset with a long interruptible action.
#
# Capture: a Resolve break at or below `surrender` % Health, or the final blow inside a
# Stagger window, is the clean Resolve surrender; Health 0 while Resolve remains is the
# forced capture (a short authored last attempt that the heroes stop safely). M19 candidates.
id: marek
name: Marek Vane
tags: [large]
bodyWidth: 80
actions:
  # --- Armed Command (the support gun's rounds) ---
  - id: jackal-burst
    name: Jackal Burst

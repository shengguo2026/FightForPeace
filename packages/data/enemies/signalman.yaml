# Jackal Signalman (Stage 2 spec §11, story line §9): the Extreme-and-higher Visible
# Call-and-Response Coordinator. Its own kit is short (Baton Check, Command Kick, Low Marker,
# Rearward Order); its danger is the calls. Each call is a raised-arm, whistle-and-baton
# startup that reserves its whole threat on commitment; any hit, a throw or enough control
# interrupts it before confirmation, and Signal Break (a vulnerable failure) follows.
# Crossfang Call: two free allies approach the target from opposite depth sides, each still
# asking the director and keeping its own telegraphs. Guard the Claim: an Enforcer or a
# Cargo Reaver escorts a Marauder or a Saboteur (formation movement only). Replace the Line
# (master variant, Ultimate): one wounded raider withdraws as it is and one enemy from the
# room's finite reserve enters through a warned edge. Isolated, it escapes. M19 candidates.

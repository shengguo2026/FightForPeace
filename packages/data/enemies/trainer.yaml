    costs: { stun: 10, scale: 10, starter: 10 }
    meter: 0
    tags: [rescueInterruptible, restraint]
    grab: { hold: 48, escapeFrom: 20, escapeWindow: 11, restraint: 150 }
    moves:
      - { from: 1, to: 18, forward: 1 }

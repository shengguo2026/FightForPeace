# Rope Trapper (Stage 3 spec §11.1): telegraphed setup, interruptible control, finite
# restraint and legal escape or partner rescue. The weighted rope whirls overhead for the
# whole long startup (the tell); any hit before the throw ends it. A caught hero has the
# universal Grab Escape window, a partner frees them with Interact (restraint release), and
# the restraint always times out (a solo hero is never stuck). One rope out at a time.
# Sheets: IDLE-WALK, ROPE (0 whirl, 1 throw, 2 pull, 3 holding, 4 rope broken, 5 recoil),
# HIT, WALK, FLEE. M27 candidates.
id: trapper
name: Rope Trapper
bodyWidth: 66
actions:
  - id: rope-throw
    name: Weighted Rope
    category: grab
    input: { context: script, dir: neutral }
    frames: { startup: 30, active: 3, recovery: 30 }
    hitbox: { x: 40, w: 230, y: 80, h: 180, depth: 40 }
    damage: 20
    reaction: { kind: stagger, hitstun: 20 }
    costs: { stun: 10, scale: 10, starter: 10 }
    meter: 0
    tags: [rescueInterruptible, restraint]
    grab: { hold: 46, escapeFrom: 18, escapeWindow: 12, restraint: 140 }

  - id: rope-pull
    name: Rope Pull
    category: grab
    input: { context: script, dir: neutral }
    frames: { startup: 28, active: 3, recovery: 30 }
    hitbox: { x: 40, w: 230, y: 80, h: 180, depth: 40 }
    damage: 40
    reaction: { kind: knockdown, hitstun: 26, push: -6, lift: 4 }
    costs: { stun: 12, scale: 12, starter: 10 }
    meter: 0
    tags: [rescueInterruptible]
    grab: { hold: 40, escapeFrom: 16, escapeWindow: 12 }
    note: 'The taut rope trips the hero toward her: a throw, not a restraint.'

  - id: rope-lash
    name: Rope Lash
    category: standing
    input: { context: script, dir: neutral }
    frames: { startup: 12, active: 4, recovery: 18, blockstun: 12 }
    hitbox: { x: 20, w: 160, y: 100, h: 120, depth: 32 }
    damage: 30
    reaction: { kind: stagger, hitstun: 16, push: 3 }
    costs: { stun: 10, scale: 10, starter: 10, guard: 8 }
    meter: 0
    tags: [counterable]

  - id: backstep
    name: Backstep
    category: standing
    input: { context: script, dir: neutral }
    frames: { startup: 2, active: 1, recovery: 20 }
    hitbox: { x: 0, w: 1, y: 0, h: 1, depth: 1 }
    damage: 0
    reaction: { kind: stagger, hitstun: 1 }
    costs: { stun: 0, scale: 0 }
    meter: 0
    tags: []
    moves:
      - { from: 1, to: 12, forward: -5 }

profile:
  role: grappler
  health: 260
  walk: { x: 3, z: 2 }
  perception: 4
  ring: 380
  defense: { tier: basic, evade: { every: 4, of: 1, action: backstep } }
  morale: { breakAt: 22, shaken: 40 }
  weapons: never
  firearms: false
  attacks:
    - { action: rope-lash, threat: 12, cooldown: 90 }
    - { action: rope-throw, threat: 30, cooldown: 300 }
    - { action: rope-pull, threat: 26, cooldown: 280, minDifficulty: medium }

variants:
  - id: trapper-elite
    name: Rope Trapper Veteran
    minDifficulty: hard
    health: 290
    defense: { tier: basic, guard: { every: 3, of: 1 }, guardHold: 20 }
  - id: trapper-master
    name: Rope Trapper Snare-Mistress
    minDifficulty: ultimate
    health: 300
    defense:
      { tier: specialist, guard: { every: 3, of: 1 }, exact: true, guardHold: 22, cooldown: 280 }

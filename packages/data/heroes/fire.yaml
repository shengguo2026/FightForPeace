# Fire Warden (火神): Stage 2 spec §7.2, stage2_feature_story_line.md §6.2. A Momentum
# Converter: kickboxing entries close distance, confirmed contact earns brief Sanda
# catches, clinches and trips, and short Qinna conclusions end the route. Shorter reach and
# more committed recovery than Wind Sentinel. Every number is an M16 Combat Lab Candidate.
#
# Contact-Confirmed Conversion (`convert`): Flashpoint Clinch, Ember Catch and Warden's
# Crucible become their clinch, trip or takedown only after a confirmed hit on an eligible
# target (never through guard). Enemies tagged `large` and bosses convert only in a
# vulnerable state (Stagger Break, Guard Crush); otherwise Crucible becomes a braced strike.
# Defensive identity (Earned Control): Ember Catch is his counter; Iron Clinch, Foundry
# Reap and Kiln-Door Release his grab route; Break the Ring (Combo Breaker) and Tempered
# Frame (Exact Block) use the universal rules and his own pictures.

# Mountain Guardian: Representative Vertical Slice normal actions.
# Frame data: spec Appendix B.1 (Combat Lab Candidate 0.2). Every other number is an
# M2 candidate for Combat Lab tuning. Units: frames at 60 Hz, pixels, pixels per frame.
# Hitbox x/w run forward from the hero's centre; y/h run up from the hero's feet.
id: mountain
name: Mountain Guardian
# Hero tags (M8): team finishers name the pairs they support by tag, never by hero id.
tags: [founder]
bodyWidth: 84

# Academy representative recipes (spec §8.3). Steps name actions; "a|b" accepts either;
# "jump" is a hint shown between steps and is not matched.
recipes:
  - id: foundation
    name: Foundation
    family: foundation
    steps: [masons-touch, brace-elbow, gatepost-hammer]
  - id: aerial-conversion
    name: Aerial conversion
    family: aerial
    steps: [high-bank-lift, jump, rafter-palm, stonefall-knee]
  - id: low-to-ground
    name: Low to ground
    family: ground
    steps: [faultline-reap, settling-palm, lockgate-press|foundation-rise]
    setup: { counterHit: true }

# Wind Sentinel (风神): Stage 2 spec §7.1, stage2_feature_story_line.md §6.1. A mobile
# whiff-punisher and route creator: fast karate entries, short confirmable strings,
# repositioning and exits; lower individual damage and guard pressure than the founders.
# Every number is an M16 Combat Lab Candidate. Units: frames at 60 Hz, pixels, pixels per
# frame. Hitbox x/w run forward from the hero's centre; y/h run up from the hero's feet.
#
# Defensive identity (Redirection and Reset): Open Gate Return is her counter response;
# Breeze Turn, Clear Path Cast and Sentinel Heel are her grab route; her Combo Breaker
# (Clear Horizon) and Exact Block use the universal rules and her own pictures.
id: wind
name: Wind Sentinel
# Hero tags (M8): `guardian` pairs every hero for Confluence Strike; `twin` marks the
# siblings' Reciprocal Handoffs and Twin Guardians' Accord (coop/coop.yaml).
tags: [guardian, twin]
bodyWidth: 56
actions:

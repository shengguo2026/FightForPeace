# M26 Mission Hub catalogue (expanded game modes spec §5, roadmap M26).
#
# Every Mission Mode entry is a content package with a stable ID and a package version.
# IDs never change once released; a new version of a package keeps its ID and bumps
# `version` (older records become Legacy records, never deleted).
#
#   family      chronicle | remix | curated | operation (the Hub's four destinations)
#   canon       canonical | side-story | remix | generated (spec §3.4, shown before launch)
#   after       the story stage the entry follows on the timeline; `place` orders entries
#               after the same stage
#   gate        what opens it: { stage: stageN } (that story stage completed, Cheat-Assisted
#               included) or { chronicle: <id> } (that Chronicle authenticated). Never a
#               score, rank, difficulty, Credits or another optional package (spec §5.4.3).
#   objective   objective family (rescue, escort, recover, apprehension, record, defeat,
#               safeguard)
#   players     supported player counts
#   heroes      any (unique unlocked heroes), { pool: [...] } or { fixed: [...] } (solo takes
#               the first, co-op the first two); planned packages may name characters that
#               are not playable yet (cast keys, shown by name only)
#   difficulties  the difficulties offered
#   status      available (its content is in this build) or planned (shown as Not installed
#               once its gate is met); `milestone` is the roadmap milestone that delivers it
#   launch      { arena: <id> } for available packages
#   lab         true: a test package shown only in the M26 Lab profiles (?hublab=…)
#
# Text: `mission.<id>.name`, `.desc`, `.clue` (spoiler-safe, shown while locked) and `.era`.

# The story stages in campaign order. Gates name these; the first ones are the campaign
# stages of progression.yaml, in the same order.
timeline: [stage1, stage2, stage3, stage4, stage5, stage6, stage7, stage8]

packages:

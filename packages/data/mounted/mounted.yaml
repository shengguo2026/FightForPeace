# M17 mounted system: the civil-protection bike, the Road Rider, the four heroes' mounted
# kits and the greybox Guided Pursuit Corridor.
#
# Sources: Stage 2 spec §8, §11, §15; stage2_feature_story_line.md §10 (motorbike), the
# twins' and the Road Rider's decision entries; Features_Decisions.md §7.4 and §13
# (founders' mounted kits, 2026-10-25).
#
# Units: frames at 60 Hz and pixels (speeds in pixels per frame). Every number is a Combat
# Lab Candidate value (spec Appendix B, E); names and slots are confirmed.

# One mechanically equivalent bike per active hero (no hidden per-hero vehicle stats).
bike:
  id: civil-bike
  name: Civil-Protection Bike
  # Identification variants, one per player slot (one shared art package).
  plates: [CP-07, CP-12]
  speed: { base: 8, min: 5, max: 11, accel: 0.2, brake: 0.35 }
  # Steering across road depth (pixels per frame) and the soft-lane pull with no vertical
  # input (stronger with optional steering assistance).
  steer: 6
  laneDrift: 1
  assistDrift: 3
  stability: 100
  # A short damage-free interval, then Stability returns a little at a time.
  recover: { delay: 150, every: 6, amount: 1 }
  # Steering wobble after a hit or an impact (steering is halved).
  wobble: 18
  # Obstacle impact: Stability loss (no Health) and the push out of the obstacle.
  impact: { barrier: 20, gate: 25, push: 60 }
  # Controlled skid after a crash, then protected recovery after any recovery.
  crash: 60
  protect: 120
  # Co-op rescue: one clearly telegraphed window; the partner rides alongside and presses
  # Team Attack. Success restores limited Stability.
  rescue: { window: 180, x: 220, z: 140, restore: 40 }
  # Shared-camera tether: beyond `soft` the leader slows and the trailer is assisted;
  # the leader can never open the gap beyond `hard` (no teleport in normal play).
  tether: { soft: 600, hard: 1000, slow: 3, assist: 2 }
  # Hops: a plain hop, the long ramp hop, and the lane shift with a direction held.
  hop: { frames: 28, height: 70, rampFrames: 44, rampHeight: 120, shift: 110, shiftFrames: 14 }

# Road Rider: the Lane-Pressure Pursuer. Rider-delivered attacks only; no ramming.
roadRider:
  id: road-rider
  name: Road Rider
  health: 240
  stability: 100
  recover: { delay: 240, every: 8, amount: 1 }
  # Warned entry inside the visibility zone: no commitment during this time.
  warn: 60
  # Approach: catch-up speed relative to the target and steering.
  catchUp: 3
  steer: 4
  # Frames alongside before a commitment.
  settle: 40
  crash: 50
  # Every `brace`-th hero hit while it approaches is braced (half Stability loss).
  braceShare: 50
  # Breakaway (authored exit) after this many committed sequences.
  breakaway: 3
  actions:
    - id: parallel-check
      name: Parallel Check
      kind: check
      windup: 20
      active: 4
      recovery: 20
      reach: { x: 130, z: 100 }
      damage: 25
      stability: 22
    - id: passing-boot
      name: Passing Boot
      kind: boot
      windup: 26
      active: 6
      recovery: 30
      reach: { x: 150, z: 190 }
      damage: 30
      stability: 28
    - id: cutoff-line
      name: Cutoff Line
      kind: cutoff
      windup: 40
      active: 90
      recovery: 0
      reach: { x: 260, z: 0 }
      damage: 0
      stability: 0
    - id: brake-fade
      name: Brake-Fade
      kind: fade
      windup: 0
      active: 60
      recovery: 0
      reach: { x: 300, z: 0 }
      damage: 0
      stability: 0
    - id: rider-brace
      name: Rider Brace
      kind: brace
      windup: 0
      active: 20
      recovery: 0
      reach: { x: 0, z: 0 }
      damage: 0
      stability: 0
    - id: breakaway
      name: Breakaway
      kind: breakaway
      windup: 0
      active: 120
      recovery: 0
      reach: { x: 0, z: 0 }
      damage: 0
      stability: 0

# Difficulty may tune Stability damage, recovery and formations; it never removes the
# low-Stability warning or the co-op rescue window, and never shortens warnings.
difficulty:
  easy: { riderStability: 70, damage: 70, windup: 10, committed: 1, brace: 0 }
  medium: { riderStability: 100, damage: 100, windup: 0, committed: 1, brace: 4 }
  hard: { riderStability: 120, damage: 110, windup: 0, committed: 2, brace: 3 }
  extreme: { riderStability: 130, damage: 120, windup: 0, committed: 2, brace: 3 }
  ultimate: { riderStability: 140, damage: 130, windup: 0, committed: 2, brace: 2 }


# The greybox Guided Pursuit Corridor (Segment 1's teaching pursuit in miniature): the
# first stretch has no enemies, then obstacles, mounted attacks, Road Riders and rescue
# are layered. Road edges are control points (top and bottom of the road at `at`).
corridors:
  - id: perimeter-pursuit
    name: Perimeter Pursuit
    goal: Reach and secure the greenhouse perimeter gate
    start: 300
    finish: 29200
    length: 30400
    road:
      - { at: 0, top: 640, bottom: 980 }
      - { at: 8600, top: 640, bottom: 980 }
      - { at: 9400, top: 700, bottom: 930 }
      - { at: 12000, top: 700, bottom: 930 }
      - { at: 12800, top: 640, bottom: 980 }
      - { at: 15800, top: 640, bottom: 980 }
      - { at: 17000, top: 610, bottom: 920 }
      - { at: 19400, top: 610, bottom: 920 }
      - { at: 20600, top: 640, bottom: 980 }
      - { at: 30400, top: 640, bottom: 980 }
    obstacles:
      - { at: 2400, z: 810, kind: barrier }
      - { at: 3600, z: 700, kind: ramp }
      - { at: 4600, z: 700, kind: barrier }
      - { at: 4600, z: 920, kind: barrier }
      - { at: 9300, z: 690, kind: gate }
      - { at: 9300, z: 940, kind: gate }
      - { at: 10800, z: 815, kind: barrier }
      - { at: 15200, z: 925, kind: ramp }
      - { at: 18200, z: 760, kind: barrier }
      - { at: 23400, z: 700, kind: barrier }
      - { at: 23400, z: 810, kind: barrier }
      - { at: 26800, z: 810, kind: ramp }
    equipment:
      - { id: valve, name: Perimeter control valve, at: 13200, side: top }
      - { id: irrigation, name: Irrigation connection, at: 17800, side: bottom }
      - { id: signal, name: Emergency signal mast, at: 22000, side: top }
    checkpoints: [6000, 12000, 18000, 24000]
    waves:
      - { at: 5200, min: easy, riders: [{ from: behind, lane: 2 }] }
      - { at: 7600, min: easy, riders: [{ from: ahead, lane: 0 }] }
      - { at: 7600, min: medium, riders: [{ from: behind, lane: 2 }] }
      - { at: 10600, min: easy, target: valve, riders: [{ from: behind, lane: 0 }] }
      - { at: 14000, min: medium, riders: [{ from: behind, lane: 2 }, { from: ahead, lane: 0 }] }
      - { at: 14000, min: hard, riders: [{ from: behind, lane: 0 }] }
      - { at: 15400, min: easy, target: irrigation, riders: [{ from: behind, lane: 2 }] }
      - { at: 19600, min: easy, target: signal, riders: [{ from: behind, lane: 0 }] }
      - { at: 21000, min: medium, riders: [{ from: behind, lane: 2 }, { from: ahead, lane: 1 }] }
      - { at: 21000, min: extreme, riders: [{ from: ahead, lane: 0 }] }
      - { at: 25200, min: easy, riders: [{ from: ahead, lane: 2 }] }
      - { at: 25200, min: medium, riders: [{ from: behind, lane: 0 }] }

# M11 progression (spec §14.2, §15.2–15.4; Features_Decisions §9, §10.3; review D10).
# Everything is keyed by stable content IDs, so later stages add entries without a new
# engine. All numbers are candidates for the creator's playtests.

# Store price bands: small cosmetics and profile items low; outfits, combat styles and
# Specials medium; directional Ultimates and prestige cosmetics high. Prices never change
# with what the player bought before.
bands: { low: 300, medium: 800, high: 1500 }

# Layered Result Payout: itemized; score only counts through the rank. Repeat clears pay
# completion, difficulty and rank again; the `once` items are paid one time per profile.
payout:
  completion: 300
  difficulty: [0, 100, 200, 300, 400]
  rank: { C: 0, B: 100, A: 200, S: 300 }
  once:
    firstClear: 1000
    # First time a stage reaches each rank (an S clear also pays the B and A steps).
    firstRank: { B: 100, A: 200, S: 400 }
    allClues: 200
  academy: { certified: 100, mastered: 150 }
  masteryLevel: 100

# Hero Mastery: non-spendable, one track per hero, earned only by the hero actually used.
mastery:
  clear: 100
  # Extra points per rank step above C (B 25, A 50, S 75).
  perRank: 25
  perLevel: 300
  maxLevel: 10

# The bounded slice store (D10): one Special, one directional Ultimate and one outfit per

# One representative Academy route (spec §14.2): every lesson runs Demonstration, Guided
# Practice, Independent Trial and an optional Mastery Goal. Goals: walk, jump, dash,
# recipe (the hero's recipe id), guard, exact, counter, special, ultimate. `frames` is a
# time limit (0 = none); `count` how many times the goal must be met.
academy:
  - id: academy.first-steps
    name: First Steps
    lessons:
      - id: academy.first-steps.move
        course: orientation
        name: Move, jump and dash
        guided: [walk, jump, dash]
        trial: { goals: [walk, jump, dash], count: 1, frames: 900 }
        mastery: { goals: [walk, jump, dash], count: 1, frames: 300 }
      - id: academy.first-steps.chain
        course: foundations
        name: Your first chain
        demo: foundation
        guided: [recipe]
        recipe: foundation
        trial: { goals: [recipe], count: 3, frames: 0 }
        mastery: { goals: [recipe], count: 3, frames: 900 }
      - id: academy.first-steps.guard
        course: defense
        name: Guard and Exact Block
        trainer: true
        guided: [guard]
        trial: { goals: [exact], count: 2, frames: 0 }
        mastery: { goals: [counter], count: 1, frames: 0 }
      - id: academy.first-steps.resources
        course: resources
        name: Special and Ultimate
        meter: 100
        guided: [special]
        trial: { goals: [ultimate], count: 1, frames: 0 }
        mastery: { goals: [special, ultimate], count: 1, frames: 600 }

  # --- M21 · Stage 2 Academy (Stage 2 spec §15) -------------------------------------------
  # `hero` fixes the lesson's hero. A `drill` lesson opens a Stage 2 test room or corridor
  # (or, with `showcase`, the practice yard with the showcase's demonstration partner, who
  # answers your part of the route) and reads its goal from the room's own records.
  - id: academy.stage2
    name: Stage 2 Academy
    lessons:
      - id: academy.stage2.wind
        course: specialization
        name: 'Wind Sentinel: precision chain'
        hero: wind
        demo: foundation
        guided: [recipe]
        recipe: foundation
        trial: { goals: [recipe], count: 3, frames: 0 }
        mastery: { goals: [recipe], count: 3, frames: 900 }
      - id: academy.stage2.fire
        course: specialization
        name: 'Fire Warden: momentum chain'
        hero: fire
        demo: foundation
        guided: [recipe]
        recipe: foundation
        trial: { goals: [recipe], count: 3, frames: 0 }
        mastery: { goals: [recipe], count: 3, frames: 900 }
      - id: academy.stage2.handoff
        course: conversion
        name: Reciprocal Handoffs
        hero: wind
        drill: { showcase: crosswind-temper }
        guided: [reciprocal]
        trial: { goals: [reciprocal], count: 2, frames: 0 }
        mastery: { goals: [reciprocal], count: 3, frames: 1200 }
      - id: academy.stage2.accord
        course: resources
        name: "Twin Guardians' Accord"
        hero: wind
        meter: 100
        drill: { showcase: horizon-accord }
        guided: [teamFinisher]
        trial: { goals: [teamFinisher], count: 1, frames: 0 }
        mastery: { goals: [teamFinisher], count: 1, frames: 900 }
      - id: academy.stage2.mounted
        course: specialization
        name: Mounted Stability and protection
        drill: { corridor: perimeter-pursuit }
        guided: [pursuitControl]
        trial: { goals: [pursuitControl], count: 2, frames: 0 }
        mastery: { goals: [pursuitSave], count: 1, frames: 0 }
      - id: academy.stage2.revolver
        course: specialization
        name: The deliberate revolver
        drill: { room: trial-marauder }
        guided: [firearmShot]
        trial: { goals: [firearmShot], count: 2, frames: 0 }
        mastery: { goals: [firearmShot], count: 3, frames: 1800 }
      - id: academy.stage2.grenade
        course: defense
        name: Return the breaching grenade
        drill: { room: beat-filtration }
        guided: [grenadeReturn]
        trial: { goals: [grenadeReturn], count: 1, frames: 0 }
        mastery: { goals: [grenadeReturn], count: 2, frames: 0 }
      - id: academy.stage2.support-gun
        course: mastery
        name: Disarm the support gun
        drill: { room: boss-marek }
        guided: [disarm]
        trial: { goals: [disarm], count: 1, frames: 0 }
        mastery: { goals: [disarm], count: 1, frames: 3600 }
      - id: academy.stage2.preservation
        course: resources
        name: Preservation and repair
        drill: { room: greenhouse-test-room }
        guided: [repair]
        trial: { goals: [repair], count: 2, frames: 0 }
        mastery: { goals: [repair], count: 3, frames: 1800 }
      - id: academy.stage2.containers
        course: resources
        name: Ownership-aware containers
        drill: { room: trial-claimhand }
        guided: [containerOpen]
        trial: { goals: [containerOpen], count: 2, frames: 0 }
        mastery: { goals: [containerOpen], count: 2, frames: 1200 }
      - id: academy.stage2.signal
        course: defense
        name: 'New roles: the Jackal Signalman'
        drill: { room: trial-signalman }
        guided: [callBreak]
        trial: { goals: [callBreak], count: 1, frames: 0 }
        mastery: { goals: [callBreak], count: 2, frames: 0 }
      - id: academy.stage2.saboteur
        course: defense
        name: 'New roles: the Systems Saboteur'
        drill: { room: trial-saboteur }
        guided: [breachStop]
        trial: { goals: [breachStop], count: 1, frames: 0 }
        mastery: { goals: [breachStop], count: 2, frames: 0 }

# --- M21 campaign layer (roadmap Stage 2 decision 2) --------------------------------------
# The stage list in Story Mode order. A stage opens when the stage it names was completed
# once on the profile (any full run, Cheat-Assisted included: story progress is narrative).
# `whatsNew` names the briefing shown once before the stage's first run. Later Story Mode
# and Stage Challenge read this same list.
# titleScreen: the village title loop, its still, the menu picture and the music the stage brings
# once it has been completed at least once (any difficulty, Cheat-Assisted included). The
# village shows the title screen of the latest completed stage in this order, else stage1's.
campaign:
  - id: stage1
    content: story.stage1.broken-water-pact
    titleScreen:
      clip: cine.stage1.title-loop
      still: story.stage1.title-loop
      menuBg: menu-bg
      music: { cue: mus.stage1.river-before-silence, state: title }
  - id: stage2
    content: story.stage2.prosperity-under-siege
    opens: { complete: stage1 }
    whatsNew: [twins, mounted, ledger, weapons, containers, enemies]
    titleScreen:
      clip: cine.stage2.title-loop
      still: story.stage2.title-loop
      menuBg: menu-bg-s2
      music: { cue: mus.stage2.what-we-protected, state: ending }

# --- M21 Village Museum and Archive (Stage 2 spec §14.2, F&D §9.1) ------------------------

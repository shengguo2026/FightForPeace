# Bandit revolver (Stage 3 spec §10.1): one per run, an enemy drop or authored pickup with
# exactly five remaining rounds. The rounds travel with the weapon (exact transfer on drop,
# disarm and pickup); there is no reload and no separate ammunition. A shot shows its warned
# aim line for the whole startup, commits the holder and costs Defense. Empty, the same
# input is a pistol whip and it can still be thrown. It never resets combo, stun, juggle,
# bounce or scaling state (shared firearm rules, M18). Uses the heroes' revolver sheets.
id: bandit-revolver
name: Bandit Revolver
class: firearm
hands: 1
ammo: 5
fire: { defenseCost: 15 }
integrity: { max: 60, worn: 40, critical: 20, hit: 4, guard: 2, clash: 6, throw: 15, deflect: 4 }
gripResistance: 30
pickup: 8
throw:
  speed: 13
  lift: 3
  responses: [blockable, exactDeflectable, counterReturnable, strikeDeflectable]
actions:
  - id: bandit-shot
    name: Ridge Shot
    category: standing
    input: { context: neutral, dir: neutral }
    frames: { startup: 22, active: 2, recovery: 28, blockstun: 16 }
    hitbox: { x: 40, w: 820, y: 140, h: 30, depth: 22 }
    damage: 65
    reaction: { kind: knockdown, hitstun: 30, push: 4, lift: 4 }
    costs: { stun: 20, scale: 20, starter: 30, guard: 20 }
    meter: 3
    ammo: 1
    tags: [warnedLine, committed]
    note: The aim line is drawn for the whole startup; the shot cannot be cancelled.

  - id: bandit-whip
    name: Revolver Whip
    category: standing
    input: { context: neutral, dir: neutral }
    frames: { startup: 8, active: 3, recovery: 16 }
    hitbox: { x: 20, w: 90, y: 130, h: 90, depth: 30 }
    damage: 45
    reaction: { kind: stagger, hitstun: 22, push: 4 }
    costs: { stun: 12, scale: 10 }
    meter: 4
    clash: light
    disarmPower: 30
    tags: [whenEmpty]
    note: The empty revolver's strike; it replaces the shot once the last round is gone.

  - id: bandit-throw
    name: Revolver Throw
    category: weaponThrow
    input: { context: weaponThrow, dir: neutral }
    frames: { startup: 10, active: 1, recovery: 14, blockstun: 12 }
    hitbox: { x: 0, w: 60, y: 110, h: 50, depth: 30 }
    damage: 35
    reaction: { kind: stagger, hitstun: 22, push: 5 }
    costs: { stun: 12, scale: 10 }
    meter: 3
    breakPower: 20

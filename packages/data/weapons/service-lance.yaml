# Telescoping Service Lance (Stage 2 spec §9.1): a blunt segmented greenhouse maintenance
# tool with locking collars, rubber grips and a short coupling hook. A complete Weapon Core
# (standing, aerial, ground, dash, low, throw) that plays differently from the Canal
# Workstaff: longer and thinner reach, a collar-lock extension finisher, a hook that pulls
# and disarms, and weaker, faster swings. Integrity loosens the collars (Worn) and bends a
# segment (Critical) before it breaks. Contextual fitting (the coupling hook on a seedling
# rack or the loading shutter) is a greenhouse interaction, see greenhouse.yaml. M18
# candidates for Combat Lab tuning; units as in workstaff.yaml.
id: service-lance
name: Telescoping Service Lance
class: temporaryMelee
hands: 2
integrity: { max: 100, worn: 60, critical: 25, hit: 5, guard: 3, clash: 12, throw: 25, deflect: 4 }
gripResistance: 35
pickup: 8
hazardDestructible: true
throw:
  speed: 16
  lift: 1
  responses: [blockable, exactDeflectable, strikeDeflectable]
actions:
  - id: lance-jab
    name: Collar Jab
    category: standing
    input: { context: neutral, dir: neutral }
    frames: { startup: 6, active: 3, recovery: 12 }
    hitbox: { x: 30, w: 170, y: 140, h: 60, depth: 30 }
    damage: 35
    reaction: { kind: stagger, hitstun: 17, push: 3 }
    costs: { stun: 10, scale: 10, starter: 12 }
    meter: 3
    clash: light
    breakPower: 20
    links:
      - { to: lance-twist, category: chain, on: [hit, guard] }
      - { to: lance-vault, category: chain, on: [hit] }

  - id: lance-twist
    name: Segment Twist
    category: standing
    input: { context: chain, dir: neutral }
    frames: { startup: 8, active: 4, recovery: 14 }
    hitbox: { x: 20, w: 175, y: 90, h: 130, depth: 34 }
    damage: 45
    reaction: { kind: stagger, hitstun: 21, push: 4 }
    costs: { stun: 12, scale: 10 }
    meter: 4
    clash: light
    breakPower: 30
    links:
      - { to: lance-extend, category: chain, on: [hit, guard] }

  - id: lance-extend
    name: Collar-Lock Extension
    category: standing
    input: { context: chain, dir: neutral }
    frames: { startup: 14, active: 4, recovery: 22 }
    hitbox: { x: 40, w: 230, y: 130, h: 80, depth: 30 }
    damage: 70
    reaction: { kind: knockback, hitstun: 26, push: 13 }
    costs: { stun: 18, scale: 15 }
    meter: 6
    clash: heavy
    breakPower: 45
    tags: [wallBounce, impact]
    note: The collars lock at full length; the strike drives the target into the scenery.

  - id: lance-reach
    name: Telescoping Reach
    category: standing
    input: { context: neutral, dir: forward }
    frames: { startup: 11, active: 4, recovery: 18 }
    hitbox: { x: 60, w: 220, y: 130, h: 70, depth: 28 }
    damage: 50
    reaction: { kind: knockback, hitstun: 22, push: 8 }
    costs: { stun: 14, scale: 12 }
    meter: 5
    clash: light
    tags: [impact]
    moves:
      - { from: 1, to: 8, forward: 3 }

  - id: lance-hook
    name: Coupling Hook
    category: standing
    input: { context: neutral, dir: backward }
    frames: { startup: 9, active: 4, recovery: 16 }
    hitbox: { x: 50, w: 170, y: 60, h: 120, depth: 32 }
    damage: 30
    reaction: { kind: stagger, hitstun: 24 }
    costs: { stun: 12, scale: 10 }
    meter: 4
    clash: light
    disarmPower: 55
    pull: 8
    note: The coupling hook draws the target in and can pull a weapon out of its hands.

  - id: lance-vault
    name: Pole Vault Lift
    category: standing
    input: { context: neutral, dir: up }
    frames: { startup: 10, active: 5, recovery: 20 }
    hitbox: { x: 20, w: 150, y: 120, h: 200, depth: 38 }
    damage: 45
    reaction: { kind: launch, hitstun: 30, push: 1.5, lift: 15 }
    costs: { stun: 15, scale: 12, juggle: 30 }
    meter: 5
    clash: light
    links:
      - { to: jump, input: neutral, category: jumpChase, on: [hit] }

  - id: lance-low
    name: Rail Sweep
    category: low
    input: { context: neutral, dir: down }
    frames: { startup: 9, active: 4, recovery: 18 }
    hitbox: { x: 20, w: 190, y: 0, h: 70, depth: 36 }
    damage: 40
    reaction: { kind: knockdown, hitstun: 30, push: 3, lift: 5 }
    costs: { stun: 20, scale: 12 }
    meter: 5
    breakPower: 25
    tags: [opensGroundWindow]

  - id: lance-air
    name: Glasshouse Arc
    category: aerial
    input: { context: air, dir: neutral }
    frames: { startup: 6, active: 4, recovery: 9, landing: true }
    hitbox: { x: 20, w: 175, y: -10, h: 140, depth: 34 }
    damage: 35
    reaction: { kind: stagger, hitstun: 18, push: 3, airPop: 7 }
    costs: { stun: 10, scale: 10, juggle: 10 }
    meter: 3
    clash: light

  - id: lance-ground
    name: Collar Pin
    category: ground
    input: { context: groundFocus, dir: neutral }
    frames: { startup: 9, active: 3, recovery: 16 }
    hitbox: { x: 20, w: 180, y: 0, h: 60, depth: 34 }
    damage: 40
    reaction: { kind: knockdown, hitstun: 28 }
    costs: { stun: 15, scale: 12 }
    meter: 4
    tags: [terminalKnockdown, groundFinisher]

  - id: lance-dash
    name: Running Extension
    category: dash
    input: { context: dash, dir: neutral }
    frames: { startup: 8, active: 4, recovery: 16 }
    hitbox: { x: 30, w: 200, y: 120, h: 80, depth: 32 }
    damage: 45
    reaction: { kind: knockback, hitstun: 24, push: 9 }
    costs: { stun: 15, scale: 12 }
    meter: 5
    clash: light
    tags: [impact]
    moves:
      - { from: 1, to: 8, forward: 6 }

  - id: lance-throw
    name: Lance Throw
    category: weaponThrow
    input: { context: weaponThrow, dir: neutral }
    frames: { startup: 10, active: 1, recovery: 14 }
    hitbox: { x: 0, w: 140, y: 120, h: 30, depth: 28 }
    damage: 55
    reaction: { kind: knockdown, hitstun: 30, push: 6, lift: 5 }
    costs: { stun: 15, scale: 12 }
    meter: 4
    breakPower: 35
    tags: [impact]

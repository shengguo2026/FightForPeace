# than the staff, heavy clash, strong disarm and the best tool against timber barriers.
# Sheet cells (HERO-*-AXE): 0 pick-up, 1 ready, 2 flat-back strike, 3 haft upstroke, 4 haft
# block, 5 throw. M27 Combat Lab candidates.
